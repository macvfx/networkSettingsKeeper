name: Network Settings Keeper
options:
  bundleIdPrefix: com.networksettingskeeper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Network Settings Keeper:
    type: application
    platform: macOS
    sources:
      - path: Network Settings Keeper
        excludes:
          - Info.plist
    info:
      path: Network Settings Keeper/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Network Settings Keeper Profile
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.networksettingskeeper.profile
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.networksettingskeeper.profile
            UTTypeDescription: Network Settings Keeper Profile
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - nskprofile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.networksettingskeeper.app
        PRODUCT_NAME: Network Settings Keeper
        CODE_SIGN_ENTITLEMENTS: Network Settings Keeper/NetworkSettingsKeeper.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  Network Settings KeeperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Network Settings Keeper/AddressTools.swift
      - path: Network Settings Keeper/PortableProfile.swift
      - path: Network Settings Keeper/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.networksettingskeeper.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Network Settings Keeper:
    build:
      targets:
        Network Settings Keeper: all
    test:
      targets:
        - Network Settings KeeperTests
    run:
      config: Debug
    archive:
      config: Release
