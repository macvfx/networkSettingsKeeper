name: Network Settings Keeper
options:
  bundleIdPrefix: com.networksettingskeeper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Network Settings Keeper:
    type: application
    platform: macOS
    sources:
      - path: Network Settings Keeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.networksettingskeeper.app
        PRODUCT_NAME: Network Settings Keeper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        CODE_SIGN_ENTITLEMENTS: Network Settings Keeper/NetworkSettingsKeeper.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Network Settings Keeper:
    build:
      targets:
        Network Settings Keeper: all
    run:
      config: Debug
    archive:
      config: Release
